<script type="module">
import * as THREE from 'three';
const V3=THREE.Vector3, M4=THREE.Matrix4, Q=THREE.Quaternion, E=THREE.Euler;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fract=x=>x-Math.floor(x);
const hash=(x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453);
// ---------- bones ----------
const B={root:0,hips:1,spine:2,chest:3,neck:4,head:5,shL:6,elL:7,haL:8,shR:9,elR:10,haR:11,thL:12,knL:13,anL:14,thR:15,knR:16,anR:17,ck1:18,ck2:19,ck3:20,prop:21,back:22};
const PARENT=[-1,0,1,2,3,4,3,6,7,3,9,10,1,12,13,1,15,16,3,18,19,11,3];
function restBones(sw,hw){return [[0,0,0],[0,.98,0],[0,1.12,0],[0,1.28,0],[0,1.5,0],[0,1.585,0],
[sw,1.435,0],[sw,1.14,0],[sw,.885,0],[-sw,1.435,0],[-sw,1.14,0],[-sw,.885,0],
[hw,.93,0],[hw,.5,0],[hw,.085,0],[-hw,.93,0],[-hw,.5,0],[-hw,.085,0],
[0,1.42,-.13],[0,1.0,-.17],[0,.6,-.2],[-sw,.885,.0],[0,1.3,-.16]]}
// ---------- loft ----------
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}
const RK=['y','rx','rz','rb','x','z','p'];
function smoothRings(rings,sub=3){const out=[],n=rings.length;
 for(let i=0;i<n-1;i++)for(let s=0;s<sub;s++){const t=s/sub,r={};
  for(const k of RK){const g=j=>{const R=rings[clamp(j,0,n-1)];return R[k]};r[k]=cr(g(i-1),g(i),g(i+1),g(i+2),t)}out.push(r)}
 out.push({...rings[n-1]});return out}
function normRing(r){return {y:r.y,rx:r.rx,rz:r.rz??r.rx,rb:r.rb??r.rz??r.rx,x:r.x||0,z:r.z||0,p:r.p||2}}
// returns {pts:[[ [x,y,z]..cols ]..rows], closed}
function loft(rings,o={}){const seg=o.seg||14,g=o.grow||0,arc=o.arc,nz=o.noise||0;
 const R=smoothRings(rings.map(normRing).sort((a,b)=>a.y-b.y),o.sub??3);const rows=[];
 const cols=arc?seg+1:seg;
 for(let i=0;i<R.length;i++){const r=R[i],row=[];
  for(let j=0;j<cols;j++){const th=arc?lerp(arc[0],arc[1],j/seg):j/seg*Math.PI*2;
   const s=Math.sin(th),c=Math.cos(th),e=2/r.p;
   let w=1+(nz?nz*(Math.sin(th*7+r.y*31)*.6+Math.sin(th*13-r.y*57)*.4):0);
   let x=Math.sign(s)*Math.pow(Math.abs(s),e)*(r.rx+g)*w, z=Math.sign(c)*Math.pow(Math.abs(c),e)*((c>=0?r.rz:r.rb)+g)*w;
   let P=[x+r.x,r.y,z+r.z];if(o.map)P=o.map(P[0],P[1],P[2]);row.push(P)}rows.push(row)}
 return {pts:rows,closed:!arc,caps:o.caps}}
function surface(fn,nu,nv){const rows=[];for(let i=0;i<=nv;i++){const row=[];for(let j=0;j<=nu;j++)row.push(fn(j/nu,i/nv));rows.push(row)}return {pts:rows,closed:false}}
// ---------- builder ----------
class Builder{constructor(){this.P=[];this.N=[];this.C=[];this.M=[];this.S=[];this.I=[]}
 vert(p,n,o){const i=this.P.length/3;this.P.push(p[0],p[1],p[2]);this.N.push(n[0],n[1],n[2]);const c=o.color;
  let col=c;if(o.split){col=(p[0]*o.split>0)?o.color:o.color2}
  if(o.colorFn)col=o.colorFn(p)||col;
  this.C.push(col[0],col[1],col[2]);this.M.push(o.mat[0],o.mat[1],o.mat[2],o.mat[3]);const sk=o.skin(p);this.S.push(sk[0],sk[1],sk[2]);return i}
 part(G,o){const rows=G.pts,nr=rows.length,nc=rows[0].length,cl=G.closed,flip=o.flip?-1:1;
  const at=(i,j)=>rows[clamp(i,0,nr-1)][cl?((j%nc)+nc)%nc:clamp(j,0,nc-1)];
  const nrm=(i,j)=>{const a=at(i,j+1),b=at(i,j-1),c=at(i+1,j),d=at(i-1,j);
   const du=[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dv=[c[0]-d[0],c[1]-d[1],c[2]-d[2]];
   let n=[du[1]*dv[2]-du[2]*dv[1],du[2]*dv[0]-du[0]*dv[2],du[0]*dv[1]-du[1]*dv[0]];const l=Math.hypot(...n)||1;return [n[0]/l*flip,n[1]/l*flip,n[2]/l*flip]};
  const layers=o.thick?[0,1]:[0];
  for(const L of layers){const base=[];
   for(let i=0;i<nr;i++){const r=[];for(let j=0;j<nc;j++){let p=rows[i][j],n=nrm(i,j);
     if(L){p=[p[0]-n[0]*o.thick,p[1]-n[1]*o.thick,p[2]-n[2]*o.thick];n=[-n[0],-n[1],-n[2]]}
     r.push(this.vert(p,n,o))}base.push(r)}
   const qc=cl?nc:nc-1,fl=(flip<0)!==(L===1);
   for(let i=0;i<nr-1;i++)for(let j=0;j<qc;j++){const a=base[i][j],b=base[i][(j+1)%nc],c=base[i+1][(j+1)%nc],d=base[i+1][j];
    if(fl)this.I.push(a,c,b,a,d,c);else this.I.push(a,b,c,a,c,d)}
   if(G.caps&&cl&&!L){for(const top of [0,1]){const ri=top?nr-1:0,ring=rows[ri];
     const cen=ring.reduce((s,p)=>[s[0]+p[0]/nc,s[1]+p[1]/nc,s[2]+p[2]/nc],[0,0,0]);
     const n=top?[0,1,0]:[0,-1,0];const ci=this.vert(cen,n,o);const ids=ring.map(p=>this.vert(p,n,o));
     for(let j=0;j<nc;j++){const a=ids[j],b=ids[(j+1)%nc];if(top)this.I.push(ci,a,b);else this.I.push(ci,b,a)}}}}
 }
 sphere(c,r,o,sq=[1,1,1]){const rings=[];const n=7;for(let i=0;i<=n;i++){const a=-Math.PI/2+Math.PI*i/n;rings.push({y:c[1]+Math.sin(a)*r*sq[1],rx:Math.max(1e-4,Math.cos(a)*r*sq[0]),rz:Math.max(1e-4,Math.cos(a)*r*sq[2]),x:c[0],z:c[2]})}
  this.part(loft(rings,{seg:o.seg||10,sub:1}),o)}
}
// skin helpers: return [b0,b1,w0]
const rigid=b=>()=>[b,b,1];
function chain(J){return p=>{let best=J[0],bd=1e9;for(const j of J){const d=Math.abs(p[1]-j.y);if(d<bd){bd=d;best=j}}
 return [best.lo,best.up,1-ss(best.y-best.r,best.y+best.r,p[1])]}}
// ---------- materials: [id, rough, metal, wear] ----------
const MAT={skin:[0,.62,0,.1],cloth:[1,.9,0,.4],quilt:[2,.88,0,.3],mail:[3,.42,.85,.4],leather:[4,.6,0,.5],plate:[5,.32,.9,.35],fur:[6,.95,0,.2],wood:[7,.7,0,.4]};
const col=h=>{const c=new THREE.Color(h);c.convertSRGBToLinear();return [c.r,c.g,c.b]};
const DARK=col('#141210');
// ---------- body ----------
function skirtSkin(lo=.72,hi=.98){return p=>{const th=p[0]>0?B.thL:B.thR;let w=1-ss(lo,hi,p[1]);w*=clamp(Math.abs(p[0])/.08,.35,1);return [th,B.hips,w]}}
function buildBody(b,d){const wf=d.wf,sw=d.sw,hw=d.hw;
 const T=[[.90,.168,.105,.115],[1.0,.17,.11,.12],[1.10,.153,.105,.10],[1.27,.182,.125,.11],[1.37,.198,.122,.112],[1.44,.19,.105,.105],[1.49,.11,.075,.085],[1.53,.056,.055,.058],[1.57,.052,.05,.055]];
 const torsoRings=T.map(r=>({y:r[0],rx:r[1]*(r[0]>1.2?d.shw||wf:wf),rz:r[2]*wf,rb:r[3]*wf,p:2.3}));
 const torsoChain=chain([{y:1.05,lo:B.hips,up:B.spine,r:.06},{y:1.2,lo:B.spine,up:B.chest,r:.06},{y:1.47,lo:B.chest,up:B.neck,r:.035}]);
 const torsoSkin=p=>{if(p[1]<1.0){const th=p[0]>0?B.thL:B.thR;return [th,B.hips,(1-ss(.88,.99,p[1]))*clamp(Math.abs(p[0])/.1,0,1)*.5]}return torsoChain(p)};
 d.torsoRings=torsoRings;d.torsoSkin=torsoSkin;
 b.part(loft(torsoRings,{seg:18,caps:true}),{color:d.skin,mat:MAT.skin,skin:torsoSkin});
 // head
 const headSkin=chain([{y:1.47,lo:B.chest,up:B.neck,r:.035},{y:1.585,lo:B.neck,up:B.head,r:.035}]);d.headSkin=headSkin;
 const H=[[1.54,.05,.05,.055,0],[1.57,.062,.07,.07,.005],[1.61,.074,.09,.085,.01],[1.66,.08,.098,.095,.005],[1.71,.084,.1,.1,0],[1.76,.076,.086,.095,-.005],[1.795,.046,.05,.06,-.01],[1.81,.006,.006,.006,-.01]];
 d.headRings=H.map(r=>({y:r[0],rx:r[1]*d.hs,rz:r[2]*d.hs,rb:r[3]*d.hs,z:r[4],p:2.2}));
 b.part(loft(d.headRings,{seg:16,caps:true}),{color:d.skin,mat:MAT.skin,skin:headSkin});
 const hk={color:d.skin,mat:MAT.skin,skin:rigid(B.head)},dk={color:DARK,mat:[0,.9,0,0],skin:rigid(B.head)};
 b.sphere([0,1.655,.1*d.hs],.022,hk,[.35,1,.65]);
 for(const sx of[-1,1]){b.sphere([sx*.034,1.69,.094*d.hs],.03,hk,[1.1,.32,.45]);b.sphere([sx*.048,1.633,.082*d.hs],.03,hk,[.9,.6,.55]);
  b.sphere([sx*.031,1.672,.088*d.hs],.017,dk,[1,.62,.4]);b.sphere([sx*.083*d.hs,1.66,0],.022,hk,[.35,1,.6])}
 // arms
 for(const sx of[-1,1]){const L=sx>0,sh=L?B.shL:B.shR,el=L?B.elL:B.elR,ha=L?B.haL:B.haR;
  const armSkin=chain([{y:1.40,lo:sh,up:B.chest,r:.05},{y:1.14,lo:el,up:sh,r:.05},{y:.885,lo:ha,up:el,r:.03}]);
  const A=[[1.48,.045],[1.435,.066],[1.35,.06],[1.25,.053],[1.14,.047],[1.05,.047],[.95,.038],[.885,.034],[.87,.033]];
  const ar=A.map(r=>({y:r[0],rx:r[1]*wf,rz:r[1]*wf*(r[0]<1.12&&r[0]>.9?1.12:1),x:sx*sw}));
  b.part(loft(ar,{seg:12,caps:true}),{color:d.armCol||d.skin,mat:d.armMat||MAT.skin,skin:armSkin,colorFn:d.armCol?(p=>p[1]<(d.sleeveY||0)?d.skin:null):null});
  d['arm'+sx]=ar;d['armSkin'+sx]=armSkin;
  // fist
  const hs={color:d.glove||d.skin,mat:d.glove?MAT.leather:MAT.skin,skin:rigid(ha)};
  b.part(loft([{y:.875,rx:.03,rz:.035},{y:.85,rx:.032,rz:.045},{y:.815,rx:.034,rz:.05},{y:.785,rx:.028,rz:.042},{y:.772,rx:.004,rz:.004}].map(r=>({...r,x:sx*sw})),{seg:10,caps:true}),hs);
  for(let k=0;k<4;k++)b.sphere([sx*(sw-.024),.80+(k===0||k===3?.006:0),-.03+k*.02],.015,hs);
  b.sphere([sx*(sw-.018),.838,.045],.016,hs,[1,1.3,1])}
 // legs + feet
 for(const sx of[-1,1]){const L=sx>0,th=L?B.thL:B.thR,kn=L?B.knL:B.knR,an=L?B.anL:B.anR;
  const legSkin=chain([{y:.93,lo:th,up:B.hips,r:.05},{y:.5,lo:kn,up:th,r:.05},{y:.085,lo:an,up:kn,r:.03}]);
  const Lg=[[.98,.088,.09],[.93,.093,.095],[.82,.082,.085],[.7,.07,.072],[.56,.057,.058],[.5,.056,.056],[.42,.054,.066],[.3,.048,.055],[.18,.041,.043],[.1,.038,.04],[.07,.036,.038]];
  const lr=Lg.map(r=>({y:r[0],rx:r[1]*wf,rz:r[1]*wf,rb:r[2]*wf,x:sx*hw}));d['leg'+sx]=lr;d['legSkin'+sx]=legSkin;
  b.part(loft(lr,{seg:12}),{color:d.legCol,mat:d.legMat||MAT.cloth,skin:legSkin});
  // boot: shell + cuff + foot + sole
  const bt={color:d.boot,mat:d.bootMat||MAT.leather,skin:legSkin};const top=d.bootTop||.3;
  const bs=lr.filter(r=>r.y<top+.001);bs.unshift({...lr[lr.findIndex(r=>r.y<top)-1]});bs.sort((a,b)=>a.y-b.y);
  b.part(loft(bs.filter(r=>r.y<=top+.13).map(r=>({...r,y:Math.min(r.y,top)})).filter((r,i,a)=>i===0||r.y>a[i-1].y+1e-4),{seg:12,grow:.009}),bt);
  if(d.cuff)b.part(loft([{y:top-.03,rx:.058*wf,x:sx*hw},{y:top,rx:.066*wf,x:sx*hw},{y:top+.03,rx:.064*wf,x:sx*hw}],{seg:12,sub:2,grow:.009}),bt);
  const F=[[-.065,.03,.035,.03],[-.045,.044,.06,.032],[-.01,.047,.075,.032],[.05,.05,.05,.032],[.11,.052,.035,.032],[.16,.046,.026,.03],[.195,.022,.016,.024]];
  const fs={color:d.boot,mat:d.bootMat||MAT.leather,skin:rigid(an)};
  const fmap=cy=>(x,y,z)=>[sx*hw+x,cy+z,y];
  b.part(loft(F.map(r=>({y:r[0],rx:r[1]*wf,rz:r[2],rb:r[3],p:2.6})),{seg:12,caps:true,map:fmap(.034)}),{...fs,flip:true});
  b.part(loft(F.map(r=>({y:r[0]*1.02,rx:r[1]*wf+.006,rz:.006,rb:.0345,p:3.2})),{seg:12,caps:true,map:fmap(.034)}),{color:DARK,mat:[4,.8,0,.2],skin:rigid(an),flip:true})}
}
// grow a stored ring set
const growR=(R,g,y0=-9,y1=9,ex={})=>R.filter(r=>r.y>=y0-1e-6&&r.y<=y1+1e-6).map(r=>({...r,rx:r.rx+g,rz:r.rz+g,rb:r.rb+g,...ex}));
function beltPart(b,d,c,y=1.0,h=.05,g=.036,buckle){const R=growR(d.torsoRings,0).map(r=>r);
 const at=yy=>{const i=R.findIndex(r=>r.y>yy);const a=R[i-1],c2=R[i],t=(yy-a.y)/(c2.y-a.y);return {y:yy,rx:lerp(a.rx,c2.rx,t),rz:lerp(a.rz,c2.rz,t),rb:lerp(a.rb,c2.rb,t),p:2.3}};
 const r0=at(y-h/2),r1=at(y+h/2);
 b.part(loft([r0,r1].map(r=>({...r,rx:r.rx+g,rz:r.rz+g,rb:r.rb+g})),{seg:18,sub:1}),{color:c,mat:MAT.leather,skin:rigid(B.hips)});
 if(buckle){const z=r0.rz+g+.004;b.part(loft([{y:y-.03,rx:.03,rz:.006,z},{y:y+.03,rx:.03,rz:.006,z}],{seg:8,sub:1,caps:true}),{color:buckle,mat:[5,.3,.9,.3],skin:rigid(B.hips)});
  b.part(loft([{y:y-.09,rx:.016,rz:.004,z:z-.002,x:.05},{y:y-.02,rx:.017,rz:.004,z:z-.002,x:.045}],{seg:6,sub:1,caps:true}),{color:c,mat:MAT.leather,skin:rigid(B.hips)})}
 return r0}
function pouch(b,x,y,z,c,s=1){b.part(loft([{y:y-.06*s,rx:.004,rz:.004},{y:y-.05*s,rx:.04*s,rz:.022*s},{y:y+.02*s,rx:.045*s,rz:.025*s},{y:y+.035*s,rx:.04*s,rz:.02*s,p:2.5}].map(r=>({...r,x,z})),{seg:10,caps:true}),{color:c,mat:MAT.leather,skin:rigid(B.hips)})}
function ringAt(R,y){let i=R.findIndex(r=>r.y>y);if(i<1)i=i<0?R.length-1:1;const a=R[i-1],c=R[i],t=clamp((y-a.y)/(c.y-a.y),0,1);return {y,rx:lerp(a.rx,c.rx,t),rz:lerp(a.rz,c.rz,t),rb:lerp(a.rb,c.rb,t),p:2.3}}
const bodySkin=d=>p=>p[1]<.98?skirtSkin()(p):d.torsoSkin(p);
function matMap(m){return (x,y,z)=>{const v=new V3(x,y,z).applyMatrix4(m);return [v.x,v.y,v.z]}}
function band(b,d,yfn,w,g,o){const nu=40,rows=[];for(const v of[0,1]){const row=[];for(let j=0;j<nu;j++){const ph=j/nu*Math.PI*2,yc=yfn(ph)+(v-.5)*w,r=ringAt(d.torsoRings,yc);
  const s=Math.sin(ph),c=Math.cos(ph);row.push([s*(r.rx+g),yc,c*((c>=0?r.rz:r.rb)+g)])}rows.push(row)}b.part({pts:rows,closed:true},o)}
function tube(b,pts,r,o){const rows=[];const n=pts.length;for(let i=0;i<n;i++){const p=new V3(...pts[i]),t=new V3(...pts[Math.min(i+1,n-1)]).sub(new V3(...pts[Math.max(i-1,0)])).normalize();
  const a=new V3(1,0,0);if(Math.abs(t.x)>.9)a.set(0,0,1);const u=a.clone().cross(t).normalize(),w=t.clone().cross(u);const row=[];
  for(let j=0;j<8;j++){const th=j/8*Math.PI*2;const q=p.clone().addScaledVector(u,Math.cos(th)*r[0]).addScaledVector(w,Math.sin(th)*r[1]);row.push([q.x,q.y,q.z])}rows.push(row)}
 b.part({pts:rows,closed:true},o)}
// ---------- KNIGHT ----------
function buildKnight(){const d={name:'knight',s:1.06,sw:.215,hw:.1,wf:1.04,shw:1.1,hs:1,skin:col('#c49a7c'),legCol:col('#5b5d62'),legMat:MAT.mail,boot:col('#9a9ea6'),bootMat:MAT.plate,armCol:col('#6f7276'),armMat:MAT.mail,glove:col('#3d2c20'),bootTop:.2};
 const b=new Builder();buildBody(b,d);const C={red:col('#6b1f24'),cream:col('#cfc4a6'),gold:col('#b08d3e'),mail:col('#75787c'),plate:col('#a9adb4'),lea:col('#4a3324'),wood:col('#5d4630'),plume:col('#a8262b')};
 const PL={color:C.plate,mat:MAT.plate};
 // mail hauberk with skirt
